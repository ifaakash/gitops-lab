---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  labels:
    app: podinfo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.17.0
          ports:
            - containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9898
            initialDelaySeconds: 
            periodSeconds: 
            failureThreshold: 
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9898
            initialDelaySeconds: 5 
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "32Mi" 
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "10m"


---

apiVersion: v1
kind: Service
metadata:
  name: podinfo
  labels:
    svc: podinfo
spec:
  type: ClusterIP
  selector:
    app: podinfo
  ports:
    - port: 9898
      targetPort: 9898
      protocol: TCP
